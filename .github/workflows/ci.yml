name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Code Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync --extra dev

      - name: Ruff Format Check
        run: uv run ruff format --check .

      - name: Ruff Linter
        run: uv run ruff check .

      - name: Mypy Static Type Checking
        run: uv run mypy src/ethos/core

      - name: Bandit Security Audit
        run: uv run bandit -r src/ethos -lll

      - name: pip-audit Dependency Vulnerability Scan
        run: |
          uv pip install pip-audit --system || uv run pip install pip-audit
          uv run pip-audit --strict --desc || true
        continue-on-error: true

  test:
    name: Test Matrix (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    needs: lint-and-typecheck
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Audio Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1 ffmpeg

      - name: Install System Audio Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libsndfile ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install Dependencies
        run: uv sync --extra dev

      - name: Run Unit & Integration Tests with Coverage
        run: uv run pytest --cov=src/ethos --cov-report=xml --cov-report=term-missing tests/unit tests/integration

      - name: Run Shadow (Golden Dataset) Tests
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: uv run pytest tests/shadow -v

      - name: Upload Coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
