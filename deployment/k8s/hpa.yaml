apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ethos-core-hpa
  labels:
    app.kubernetes.io/name: ethos-core
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ethos-core
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
